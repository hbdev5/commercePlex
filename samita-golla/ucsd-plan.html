<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samita's UCSD Adventure Guide</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;0,800;1,300;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --sand:#F5EDD8;--sand2:#EDE0C4;
  --ocean:#1A5C82;--ocean-light:#D4EAF5;
  --coral:#E8603A;--coral-light:#FAEAE4;
  --mint:#2A8C6E;--mint-light:#D6F0E8;
  --gold:#C97B2A;--gold-light:#FDF0DC;
  --purple:#6B47C4;--purple-light:#EDE8FF;
  --ink:#1C1A17;--ink2:#4A4540;--muted:#9A8F82;
  --white:#FEFCF8;
}
body{font-family:'DM Sans',sans-serif;background:var(--sand);color:var(--ink);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 10% 0%,rgba(26,92,130,0.08) 0%,transparent 60%),radial-gradient(ellipse 60% 80% at 90% 100%,rgba(232,96,58,0.1) 0%,transparent 60%);pointer-events:none;z-index:0;}
.wrapper{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 1.5rem 4rem;}
.hero{text-align:center;padding:3rem 0 2rem;animation:fadeUp 0.7s ease both;}
.hero-badge{display:inline-block;background:var(--ocean);color:var(--ocean-light);font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;padding:5px 14px;border-radius:20px;margin-bottom:1rem;}
.hero h1{font-family:'Fraunces',serif;font-size:clamp(2.4rem,8vw,3.4rem);font-weight:800;line-height:1.05;color:var(--ink);margin-bottom:0.5rem;}
.hero h1 span{color:var(--coral);font-style:italic;}
.hero-sub{font-size:15px;color:var(--ink2);font-weight:300;max-width:380px;margin:0 auto 0.5rem;line-height:1.6;}
.hero-wave{font-size:2.2rem;display:inline-block;margin:0.5rem 0 1.5rem;animation:wave 2.4s ease-in-out infinite;transform-origin:70% 70%;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:2rem;animation:fadeUp 0.7s 0.15s ease both;}
.tab-btn{padding:8px 16px;border-radius:24px;border:1.5px solid transparent;background:var(--white);color:var(--ink2);cursor:pointer;font-size:13px;font-family:'DM Sans',sans-serif;font-weight:400;transition:all 0.2s;}
.tab-btn:hover{border-color:var(--muted);}
.tab-btn[data-deck="0"].active{background:var(--ocean);color:var(--ocean-light);border-color:var(--ocean);font-weight:500;}
.tab-btn[data-deck="1"].active{background:var(--mint);color:var(--mint-light);border-color:var(--mint);font-weight:500;}
.tab-btn[data-deck="2"].active{background:var(--purple);color:var(--purple-light);border-color:var(--purple);font-weight:500;}
.tab-btn[data-deck="3"].active{background:var(--coral);color:#fff;border-color:var(--coral);font-weight:500;}
.tab-btn[data-deck="4"].active{background:var(--gold);color:var(--gold-light);border-color:var(--gold);font-weight:500;}
.cards-grid{display:flex;flex-direction:column;gap:16px;animation:fadeUp 0.5s 0.1s ease both;}
.card{background:var(--white);border-radius:18px;border:1.5px solid rgba(28,26,23,0.09);padding:1.4rem 1.5rem 1.3rem;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:-24px;right:-24px;width:90px;height:90px;border-radius:50%;opacity:0.07;}
.deck-0 .card::before{background:var(--ocean);}
.deck-1 .card::before{background:var(--mint);}
.deck-2 .card::before{background:var(--purple);}
.deck-3 .card::before{background:var(--coral);}
.deck-4 .card::before{background:var(--gold);}
.card-num{font-family:'Fraunces',serif;font-style:italic;font-weight:300;font-size:11px;margin-bottom:0.4rem;}
.deck-0 .card-num{color:var(--ocean);}
.deck-1 .card-num{color:var(--mint);}
.deck-2 .card-num{color:var(--purple);}
.deck-3 .card-num{color:var(--coral);}
.deck-4 .card-num{color:var(--gold);}
.card-title{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:600;line-height:1.35;color:var(--ink);margin-bottom:0.9rem;padding-bottom:0.7rem;border-bottom:1px solid rgba(28,26,23,0.08);}
.card-items{list-style:none;padding:0;display:flex;flex-direction:column;gap:7px;}
.card-items li{font-size:14px;line-height:1.55;color:var(--ink2);padding-left:1.3rem;position:relative;}
.card-items li::before{content:'→';position:absolute;left:0;font-size:11px;top:2px;}
.deck-0 .card-items li::before{color:var(--ocean);}
.deck-1 .card-items li::before{color:var(--mint);}
.deck-2 .card-items li::before{color:var(--purple);}
.deck-3 .card-items li::before{color:var(--coral);}
.deck-4 .card-items li::before{color:var(--gold);}
.research-banner{background:var(--purple);border-radius:18px;padding:1.5rem 1.5rem 1.3rem;margin-bottom:16px;color:var(--purple-light);}
.research-banner h2{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:800;color:#fff;margin-bottom:0.3rem;}
.research-banner p{font-size:13px;font-weight:300;opacity:0.85;line-height:1.5;}
.dog-card{background:var(--white);border-radius:18px;border:1.5px solid rgba(28,26,23,0.09);overflow:hidden;}
.dog-card-header{padding:1.2rem 1.5rem 0.8rem;}
.dog-card-label{font-family:'Fraunces',serif;font-style:italic;font-weight:300;font-size:11px;color:var(--gold);margin-bottom:0.35rem;}
.dog-card-title{font-family:'Fraunces',serif;font-size:1.05rem;font-weight:600;color:var(--ink);line-height:1.35;padding-bottom:0.7rem;border-bottom:1px solid rgba(28,26,23,0.08);}
.dog-photo-wrap img{width:100%;display:block;height:auto;}
.dog-caption{padding:1rem 1.5rem 1.2rem;font-size:13px;color:var(--ink2);line-height:1.6;font-style:italic;text-align:center;font-family:'Fraunces',serif;font-weight:300;}
.footer{text-align:center;margin-top:2.5rem;padding:2rem 1.5rem;background:var(--white);border-radius:20px;border:1.5px solid rgba(28,26,23,0.08);}
.footer-msg{font-family:'Fraunces',serif;font-size:1.1rem;font-style:italic;font-weight:300;color:var(--ink2);line-height:1.7;max-width:380px;margin:0 auto 0.75rem;}
.footer-hearts{font-size:1.4rem;margin-bottom:0.5rem;display:block;}
.footer-sig{font-size:14px;color:var(--ink);font-weight:500;}
.deco{position:fixed;font-family:'Fraunces',serif;font-style:italic;font-weight:300;color:rgba(28,26,23,0.06);pointer-events:none;z-index:0;user-select:none;}
.deco-tl{top:1.5rem;left:1.5rem;font-size:3.5rem;transform:rotate(-12deg);}
.deco-br{bottom:1.5rem;right:1.5rem;font-size:3rem;transform:rotate(8deg);}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
@keyframes wave{0%,100%{transform:rotate(0deg);}25%{transform:rotate(20deg);}75%{transform:rotate(-10deg);}}
</style>
</head>
<body>
<div class="deco deco-tl">☀</div>
<div class="deco deco-br">🌊</div>
<div class="wrapper">
  <div class="hero">
    <div class="hero-badge">San Jose &#8594; San Diego</div>
    <h1>Your UCSD<br><span>Adventure</span> Guide</h1>
    <p class="hero-sub">Everything you need to thrive in the college.</p>
    <span class="hero-wave">👋</span>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="deckWrap"></div>
  <div class="footer">
    <span class="footer-hearts">💛🌊☀️</span>
    <p class="footer-msg">&#8220;San Diego is where you grow &#8212; San Jose is always where you&#8217;re from.&#8221;</p>
    <p class="footer-sig">Made with love from Mom &amp; Dad</p>
  </div>
</div>

var activeDeck = 0;

function setDeckClass() {
  document.getElementById("deckWrap").className = "deck-" + activeDeck;
}

function esc(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderDeck() {
  var d = decks[activeDeck];
  var wrap = document.getElementById("deckWrap");
  var html = '<div class="cards-grid">';

  if (d.banner) {
    html += '<div class="research-banner"><h2>' + esc(d.banner.title) + '</h2><p>' + esc(d.banner.sub) + '</p></div>';
  }

  for (var i = 0; i < d.cards.length; i++) {
    var c = d.cards[i];
    html += '<div class="card">';
    html += '<div class="card-num">Card ' + (i+1) + ' of ' + d.cards.length + '</div>';
    html += '<div class="card-title">' + esc(c.q) + '</div>';
    html += '<ul class="card-items">';
    for (var j = 0; j < c.items.length; j++) {
      html += '<li>' + esc(c.items[j]) + '</li>';
    }
    html += '</ul></div>';
  }

  if (activeDeck === 4) {
    html += '<div class="dog-card">';
    html += '<div class="dog-card-header">';
    html += '<div class="dog-card-label">always with you</div>';
    html += '<div class="dog-card-title">Your pups are missing you just as much &#128062;</div>';
    html += '</div>';
    html += '<div class="dog-photo-wrap"><img src="data:image/png;base64,' + DOG + '" alt="Samita with her dog"></div>';
    html += '<div class="dog-caption">&#8220;They&#8217;ll be the first ones at the door when you come home.&#8221;</div>';
    html += '</div>';
  }

  html += '</div>';
  wrap.innerHTML = html;
}

function buildTabs() {
  var el = document.getElementById("tabs");
  el.innerHTML = "";
  for (var i = 0; i < decks.length; i++) {
    (function(idx) {
      var b = document.createElement("button");
      b.className = "tab-btn" + (idx === activeDeck ? " active" : "");
      b.setAttribute("data-deck", idx);
      b.textContent = decks[idx].label;
      b.onclick = function() {
        activeDeck = idx;
        setDeckClass();
        buildTabs();
        renderDeck();
      };
      el.appendChild(b);
    })(i);
  }
}

setDeckClass();
buildTabs();
renderDeck();
